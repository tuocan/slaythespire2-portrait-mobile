name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install CSharpier Tool
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0"

      - name: Build Managed Project and Android APK
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh
          
          # 1. Build base Godot AAR
          cd vendor/godot/platform/android/java
          ./gradlew assembleTemplateRelease
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/libs/release
          find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;

          # 2. Compile Godot C++ native .so and inject into AAR
          ./scripts/build-godot.sh

          # 3. Patch android/build.gradle to sign release build using debug key
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/build.gradle

          # 4. Explicitly populate android/assets/dotnet_bcl with all Mono BCL + upstream + published assemblies
          mkdir -p android/assets/dotnet_bcl
          cp -a upstream/godot-export/.godot/mono/publish/arm64/*.dll android/assets/dotnet_bcl/ 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet /usr/share/dotnet -path "*/runtimes/android-arm64/*" -name "*.dll" -exec cp {} android/assets/dotnet_bcl/ \; 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet /usr/share/dotnet -name "System.Private.CoreLib.dll" -exec cp {} android/assets/dotnet_bcl/ \; 2>/dev/null || true

          # 5. Copy ALL native C++ / Mono runtime .so dependencies (libc++_shared.so, libSystem.Security.Cryptography.Native.Android.so, etc.)
          mkdir -p android/libs/release/arm64-v8a
          find "$ANDROID_NDK_ROOT" -name "libc++_shared.so" -path "*aarch64*" -exec cp {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find ~/.nuget/packages -path "*/runtimes/android-arm64/native/*.so" -exec cp {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # 6. Build STS2 mobile patcher & assemble final APK
          ./scripts/build.sh --no-bump

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
