name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons

      - name: Cache Godot C++ Build
        uses: actions/cache@v4
        with:
          path: |
            android/libs/release
            vendor/godot/platform/android/java/lib/libs
          key: godot-cpp-v1-${{ hashFiles('scripts/build-godot.sh', 'scripts/setup-godot-source.sh', 'patches/godot/*') }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install CSharpier Tool
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0"

      - name: Build Managed Project and Android APK
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh
          
          # 1. Build base Godot AAR
          cd vendor/godot/platform/android/java
          ./gradlew assembleTemplateRelease
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/libs/release/arm64-v8a
          find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;

          # 2. Compile Godot C++ native .so (Skip if cached from previous run)
          if [ ! -f "android/libs/release/arm64-v8a/libgodot_android.so" ]; then
            ./scripts/build-godot.sh
          else
            echo "Godot C++ native build restored from cache! Skipping SCons compilation."
          fi

          # 3. Patch android/build.gradle to sign release build using debug key
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/build.gradle

          # 4. Generate the bootstrap PCK
          python3 scripts/make-bootstrap-pck.py

          # 5. Restore .NET packages FIRST so Mono Android runtime packages exist in ~/.nuget/packages
          dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release

          # 6. Populate android/assets/dotnet_bcl with ALL assemblies
          mkdir -p android/assets/dotnet_bcl
          cp -a upstream/godot-export/.godot/mono/publish/arm64/*.dll android/assets/dotnet_bcl/ 2>/dev/null || true
          cp -a src/STS2Mobile/bin/Release/net9.0/publish/*.dll android/assets/dotnet_bcl/ 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet /usr/share/dotnet -name "*.dll" -path "*/runtimes/android-arm64/*" -exec cp {} android/assets/dotnet_bcl/ \; 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet /usr/share/dotnet -name "System.Private.CoreLib.dll" -exec cp {} android/assets/dotnet_bcl/ \; 2>/dev/null || true

          # 7. Copy ALL native .so libraries NOW THAT NUGET HAS RESTORED MONO (libmonosgen-2.0.so, libc++_shared.so, etc.)
          find "$ANDROID_NDK_ROOT" -name "libc++_shared.so" -path "*aarch64*" -exec cp {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find ~/.nuget/packages -name "*.so" -path "*/runtimes/android-arm64/*" -exec cp {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find vendor/godot -name "*.so" -exec cp {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # Inject all native .so libraries directly into the AAR
          TMPAAR=$(mktemp -d)
          mkdir -p "$TMPAAR/jni/arm64-v8a"
          cp android/libs/release/arm64-v8a/*.so "$TMPAAR/jni/arm64-v8a/"
          (cd "$TMPAAR" && zip -u "$GITHUB_WORKSPACE/android/libs/release/godot-lib.template_release.aar" jni/arm64-v8a/*.so)
          rm -rf "$TMPAAR"

          # 8. Build STS2 mobile patcher & assemble final APK
          ./scripts/build.sh --no-bump

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
