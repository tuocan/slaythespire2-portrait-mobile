name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip unzip curl build-essential scons cmake ninja-build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Godot Source
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh

      - name: Cache Godot C++ Build
        uses: actions/cache@v4
        with:
          path: |
            android/libs/release
            vendor/godot/platform/android/java/lib/libs
          key: godot-cpp-v3-${{ hashFiles('scripts/build-godot.sh', 'scripts/setup-godot-source.sh', 'patches/godot/*') }}
          restore-keys: |
            godot-cpp-v3-
            godot-cpp-v2-

      - name: Compile Godot Engine Native Binaries
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"

          if [ ! -f "android/libs/release/godot-lib.template_release.aar" ]; then
            cd vendor/godot/platform/android/java
            ./gradlew assembleTemplateRelease
            cd "$GITHUB_WORKSPACE"
            mkdir -p android/libs/release/arm64-v8a
            find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;
          fi

          if [ ! -f "android/libs/release/arm64-v8a/libgodot_android.so" ]; then
            echo "Godot native libraries missing from cache. Rebuilding Godot engine..."
            ./scripts/build-godot.sh
          else
            echo "Godot native libraries present in cache. Skipping rebuild."
          fi

      - name: Download and Stage Android Mono Runtime & BCL
        run: |
          DOTNET_VERSION="9.0.0"
          PACKAGE="microsoft.netcore.app.runtime.mono.android-arm64"
          URL="https://api.nuget.org/v3-flatcontainer/${PACKAGE}/${DOTNET_VERSION}/${PACKAGE}.${DOTNET_VERSION}.nupkg"

          mkdir -p /tmp/mono-runtime
          echo "Downloading $PACKAGE $DOTNET_VERSION..."
          curl -fsSL -o /tmp/mono-runtime/runtime.zip "$URL"
          unzip -q /tmp/mono-runtime/runtime.zip -d /tmp/mono-runtime/extracted

          mkdir -p android/libs/release/arm64-v8a
          mkdir -p android/assets/dotnet_bcl

          # Copy Mono runtime native shared libraries (.so)
          find /tmp/mono-runtime/extracted/runtimes/android-arm64/native -name "*.so" -exec cp -v {} android/libs/release/arm64-v8a/ \;

          # Copy BCL assemblies (.dll)
          if [ -d "/tmp/mono-runtime/extracted/runtimes/android-arm64/lib/net9.0" ]; then
            cp -v /tmp/mono-runtime/extracted/runtimes/android-arm64/lib/net9.0/*.dll android/assets/dotnet_bcl/
          fi

      - name: Compile Native Bridges (FMOD & MonoMod)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          CLANG="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"

          mkdir -p android/libs/release/arm64-v8a

          if [ -f "android/native/sts2fmodbridge/sts2fmodbridge.c" ]; then
            echo "Compiling sts2fmodbridge..."
            $CLANG -shared -fPIC -O2 android/native/sts2fmodbridge/sts2fmodbridge.c -o android/libs/release/arm64-v8a/libsts2fmodbridge.so
          fi

          if [ -f "native/monomodshim/monomodshim.c" ]; then
            echo "Compiling monomodshim..."
            $CLANG -shared -fPIC -O2 native/monomodshim/monomodshim.c -o android/libs/release/arm64-v8a/libmonomodshim.so
          fi

      - name: Build STS2Mobile & Stage Managed Dependencies
        run: |
          mkdir -p android/assets/dotnet_bcl

          # 1. Publish STS2Mobile managed project
          dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release
          PUBLISH_DIR="src/STS2Mobile/bin/Release/net9.0/publish"

          cp -v "$PUBLISH_DIR"/STS2Mobile.dll \
                "$PUBLISH_DIR"/SteamKit2.dll \
                "$PUBLISH_DIR"/protobuf-net.dll \
                "$PUBLISH_DIR"/protobuf-net.Core.dll \
                "$PUBLISH_DIR"/System.IO.Hashing.dll \
                "$PUBLISH_DIR"/ZstdSharp.dll \
                android/assets/dotnet_bcl/

          # 2. Copy upstream game assemblies
          UPSTREAM_DIR="upstream/godot-export/.godot/mono/publish/arm64"
          cp -v "$UPSTREAM_DIR"/0Harmony.dll \
                "$UPSTREAM_DIR"/GodotSharp.dll \
                "$UPSTREAM_DIR"/sts2.dll \
                "$UPSTREAM_DIR"/Steamworks.NET.dll \
                android/assets/dotnet_bcl/

          # Ensure Sentry is excluded (crashes native threads on Android)
          rm -f android/assets/dotnet_bcl/Sentry.dll

          # 3. Apply IL patches for Android
          dotnet build tools/SteamKitAndroidPatch/SteamKitAndroidPatch.csproj -c Release
          dotnet tools/SteamKitAndroidPatch/bin/Release/net9.0/SteamKitAndroidPatch.dll \
            android/assets/dotnet_bcl/SteamKit2.dll \
            android/assets/dotnet_bcl/STS2Mobile.dll \
            android/assets/dotnet_bcl/sts2.dll

      - name: Generate Bootstrap PCK
        run: |
          if [ -f "scripts/make-bootstrap-pck.py" ]; then
            python3 scripts/make-bootstrap-pck.py
          fi

      - name: Build APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/build.gradle
          cd android
          chmod +x gradlew
          ./gradlew assembleMonoRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
