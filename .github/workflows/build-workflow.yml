name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons cmake ninja-build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android .NET Workload & Tools
        run: |
          dotnet workload install android --ignore-failed-sources || true
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Godot Source
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh

      - name: Cache Godot C++ Build
        uses: actions/cache@v4
        with:
          path: |
            android/libs/release
            vendor/godot/platform/android/java/lib/libs
          key: godot-cpp-v2-${{ hashFiles('scripts/build-godot.sh', 'scripts/setup-godot-source.sh', 'patches/godot/*') }}

      - name: Compile Godot Engine Native Binaries
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          
          if [ ! -f "android/libs/release/godot-lib.template_release.aar" ]; then
            cd vendor/godot/platform/android/java
            ./gradlew assembleTemplateRelease
            cd "$GITHUB_WORKSPACE"
            mkdir -p android/libs/release/arm64-v8a
            find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;
          fi

          if [ ! -f "android/libs/release/arm64-v8a/libgodot_android.so" ]; then
            ./scripts/build-godot.sh
          fi

      - name: Restore Managed Assemblies & Download Android Mono Runtime
        run: |
          dotnet restore src/STS2Mobile/STS2Mobile.csproj -r android-arm64
          dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release -r android-arm64 --self-contained false || dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release

      - name: Collect Native Shared Libraries (.so)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          
          mkdir -p android/libs/release/arm64-v8a
          mkdir -p android/src/main/jniLibs/arm64-v8a

          # 1. Copy Mono runtime .so files (libmonosgen-2.0.so, etc.) from nuget packages
          find ~/.nuget/packages -name "*.so" -path "*/android-arm64/*" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # 2. Copy NDK libc++_shared.so
          find "$ANDROID_NDK_ROOT" -name "libc++_shared.so" -path "*aarch64*" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # 3. Copy any native .so files compiled in native/ or vendor dirs (libsts2.so)
          find . -name "*.so" -not -path "./android/build/*" -not -path "./.git/*" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # Mirror libs to AGP jniLibs and update base template AAR
          cp -v android/libs/release/arm64-v8a/*.so android/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true

          TMPAAR=$(mktemp -d)
          mkdir -p "$TMPAAR/jni/arm64-v8a"
          cp android/libs/release/arm64-v8a/*.so "$TMPAAR/jni/arm64-v8a/"
          (cd "$TMPAAR" && zip -u "$GITHUB_WORKSPACE/android/libs/release/godot-lib.template_release.aar" jni/arm64-v8a/*.so)
          rm -rf "$TMPAAR"

          echo "packaged libs:"
          ls -la android/libs/release/arm64-v8a/

      - name: Generate Bootstrap PCK
        run: |
          if [ -f "scripts/make-bootstrap-pck.py" ]; then
            python3 scripts/make-bootstrap-pck.py
          fi

      - name: Build APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/build.gradle
          ./scripts/build.sh --no-bump

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
