name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install CSharpier Tool
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;25.2.9519653" "build-tools;34.0.0"

      - name: Build Managed Project and Android APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}/ndk/25.2.9519653
          ARCHES: "arm64"
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh
          
          # 1. Build the base Godot AAR containing AndroidManifest.xml and Java templates
          cd vendor/godot/platform/android/java
          ./gradlew :godot-lib:assembleTemplateRelease
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/libs/release
          cp vendor/godot/platform/android/java/lib/build/outputs/aar/godot-lib.template_release.aar android/libs/release/

          # 2. Compile Godot C++ .so native binaries and inject them into the AAR
          ./scripts/build-godot.sh

          # 3. Build STS2 mobile patcher & assemble final APK
          ./scripts/build.sh --no-bump

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
