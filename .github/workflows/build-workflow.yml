name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons cmake ninja-build

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Android .NET Workload & Tools
        run: |
          dotnet workload install android --ignore-failed-sources || true
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK & Build Tools
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0" "platforms;android-35"

      - name: Setup Godot Source
        run: |
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh

      - name: Cache Godot C++ Build
        uses: actions/cache@v4
        with:
          path: |
            android/libs/release
            vendor/godot/platform/android/java/lib/libs
          key: godot-cpp-v3-${{ hashFiles('scripts/build-godot.sh', 'scripts/setup-godot-source.sh', 'patches/godot/*') }}
          restore-keys: |
            godot-cpp-v3-
            godot-cpp-v2-

      - name: Compile Godot Engine Native Binaries
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          
          if [ ! -f "android/libs/release/godot-lib.template_release.aar" ]; then
            cd vendor/godot/platform/android/java
            ./gradlew assembleTemplateRelease
            cd "$GITHUB_WORKSPACE"
            mkdir -p android/libs/release/arm64-v8a
            find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;
          fi

          # Force rebuild if either libgodot_android.so or libmonosgen-2.0.so is missing
          if [ ! -f "android/libs/release/arm64-v8a/libgodot_android.so" ] || [ ! -f "android/libs/release/arm64-v8a/libmonosgen-2.0.so" ]; then
            echo "Godot native libraries missing from cache. Rebuilding Godot engine..."
            ./scripts/build-godot.sh
          else
            echo "All Godot native libraries present in cache. Skipping rebuild."
          fi

      - name: Build Native C/C++ Modules (libsts2.so, etc.)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          if [ -d "native" ]; then
            for dir in native/*/; do
              if [ -f "${dir}CMakeLists.txt" ]; then
                echo "Building C++ module in $dir"
                mkdir -p "${dir}build"
                (cd "${dir}build" && cmake -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-35 -G Ninja .. && ninja) || true
              elif [ -f "${dir}build.sh" ]; then
                echo "Running build.sh in $dir"
                (cd "$dir" && chmod +x build.sh && ./build.sh) || true
              fi
            done
          fi

      - name: Restore Managed Assemblies & Download Android Mono Runtime
        run: |
          dotnet restore src/STS2Mobile/STS2Mobile.csproj -r android-arm64
          dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release -r android-arm64 --self-contained false || dotnet publish src/STS2Mobile/STS2Mobile.csproj -c Release

      - name: Collect All Native Shared Libraries (.so) & BCL Assemblies (.dll)
        run: |
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          
          mkdir -p android/libs/release/arm64-v8a
          mkdir -p android/src/main/jniLibs/arm64-v8a
          mkdir -p android/src/mono/jniLibs/arm64-v8a
          mkdir -p android/assets/dotnet_bcl

          # 1. Sweep and copy ALL .so files from vendor/godot, native, upstream, nuget, dotnet, and NDK
          find vendor/godot -name "*.so" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find native -name "*.so" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find upstream -name "*.so" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet -name "*.so" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find "$ANDROID_NDK_ROOT" -name "libc++_shared.so" -path "*aarch64*" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true
          find . -maxdepth 4 -name "*.so" -not -path "./android/build/*" -not -path "./.git/*" -exec cp -v {} android/libs/release/arm64-v8a/ \; 2>/dev/null || true

          # Mirror all native libraries across AGP source sets
          cp -v android/libs/release/arm64-v8a/*.so android/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp -v android/libs/release/arm64-v8a/*.so android/src/mono/jniLibs/arm64-v8a/ 2>/dev/null || true

          # Inject native libraries into base template AAR
          TMPAAR=$(mktemp -d)
          mkdir -p "$TMPAAR/jni/arm64-v8a"
          cp android/libs/release/arm64-v8a/*.so "$TMPAAR/jni/arm64-v8a/"
          (cd "$TMPAAR" && zip -u "$GITHUB_WORKSPACE/android/libs/release/godot-lib.template_release.aar" jni/arm64-v8a/*.so)
          rm -rf "$TMPAAR"

          # 2. Sweep and copy ALL .dll BCL assemblies into android/assets/dotnet_bcl
          find ~/.nuget/packages ~/.dotnet -name "*.dll" -exec cp -v {} android/assets/dotnet_bcl/ \; 2>/dev/null || true
          find upstream -name "*.dll" -exec cp -v {} android/assets/dotnet_bcl/ \; 2>/dev/null || true
          find src/STS2Mobile/bin -name "*.dll" -exec cp -v {} android/assets/dotnet_bcl/ \; 2>/dev/null || true

          echo "=== PACKAGED NATIVE LIBRARIES (.so) ==="
          ls -la android/libs/release/arm64-v8a/
          echo "=== PACKAGED BCL ASSEMBLIES (.dll) ==="
          ls -la android/assets/dotnet_bcl/

      - name: Generate Bootstrap PCK
        run: |
          if [ -f "scripts/make-bootstrap-pck.py" ]; then
            python3 scripts/make-bootstrap-pck.py
          fi

      - name: Build APK
        run: |
          sed -i 's/signingConfig signingConfigs.release/signingConfig signingConfigs.debug/g' android/build.gradle
          ./scripts/build.sh --no-bump

          # Re-sync native libs and BCL after build.sh execution to ensure gradle packs everything
          cp -v android/libs/release/arm64-v8a/*.so android/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          cp -v android/libs/release/arm64-v8a/*.so android/src/mono/jniLibs/arm64-v8a/ 2>/dev/null || true
          find ~/.nuget/packages ~/.dotnet -name "*.dll" -exec cp {} android/assets/dotnet_bcl/ \; 2>/dev/null || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
