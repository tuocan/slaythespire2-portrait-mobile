name: Build Slay the Spire 2 Portrait APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-pip python3-venv zip build-essential scons

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install CSharpier Tool
        run: |
          dotnet tool install -g csharpier
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "ndk;28.1.13356709" "build-tools;35.0.0"

      - name: Build Managed Project and Android APK
        env:
          ARCHES: "arm64"
        run: |
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_SDK_ROOT/ndk/28.1.13356709"
          chmod +x scripts/*.sh
          ./scripts/setup-godot-source.sh
          
          # 1. Build base Godot AAR
          cd vendor/godot/platform/android/java
          ./gradlew assembleTemplateRelease
          cd "$GITHUB_WORKSPACE"
          mkdir -p android/libs/release
          find vendor/godot/platform/android/java -name "*.aar" -exec cp {} android/libs/release/godot-lib.template_release.aar \;

          # 2. Compile Godot C++ native .so and inject into AAR
          ./scripts/build-godot.sh

          # 3. Generate a debug keystore at the expected debug keystore location
          mkdir -p "$HOME/.android"
          keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          # 4. Force Gradle to run a debug/unsigned build instead of release packaging
          sed -i 's/export_build_type=release/export_build_type=debug/g' android/gradle.properties || true

          # 5. Build STS2 mobile patcher & assemble final APK
          ./scripts/build.sh --no-bump

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sts2-portrait-mobile-apk
          path: android/build/outputs/apk/**/*.apk
